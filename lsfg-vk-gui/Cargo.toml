[package]
name = "lsfg-vk-gui"
version = "1.1.0"
edition = "2021"
description = "A GTK4/libadwaita GUI for configuring lsfg-vk frame generation"

[dependencies]
gtk4 = "0.9"
adw = { version = "0.7", package = "libadwaita", features = ["v1_4"] }
gio = "0.20"
glib = "0.20"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
